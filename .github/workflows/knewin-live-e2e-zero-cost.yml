name: Knewin Live E2E Zero Cost

on:
  push:
    branches:
      - ops/knewin-live-e2e-zero-cost-20260923
    paths:
      - .github/workflows/knewin-live-e2e-zero-cost.yml

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KNEWIN_API_KEY: ${{ secrets.KNEWIN_API_KEY }}
      KNEWIN_START: '2026-08-01T00:00:00Z'
      KNEWIN_END: '2026-08-31T23:59:59Z'
      CORRELATION_ID: knewin-zero-cost-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar pré-condição de autenticação
        shell: bash
        run: |
          if [ -z "$KNEWIN_API_KEY" ]; then
            echo 'E2E_BLOCKED: KNEWIN_API_KEY ausente' >&2
            exit 20
          fi
      - name: Executar E2E real Knewin
        run: python scripts/e2e_live_knewin.py
      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knewin-live-e2e-zero-cost-${{ github.run_id }}
          path: evidence/private/e2e-live-summary.json
          if-no-files-found: warn
          retention-days: 1
