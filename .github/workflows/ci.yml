name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar ambiente portátil
        run: python scripts/local_doctor.py
      - name: Validar plano do setup local
        run: python tests/test_setup_local.py
      - name: Validar construção do pacote portátil
        run: python tests/test_build_portable.py
      - name: Validar descoberta de endpoints Knewin
        run: python tests/test_knewin_discovery.py
      - name: Validar plano evidenciado do coletor Knewin
        run: python tests/test_knewin_collector_plan.py
      - name: Validar sintaxe dos scripts interativos
        run: python -m py_compile scripts/probe_knewin_session.py scripts/analyze_knewin_inventory.py scripts/prepare_knewin_collector.py
      - name: Gerar pacote portátil
        run: python scripts/build_portable.py
      - name: Publicar pacote portátil
        uses: actions/upload-artifact@v4
        with:
          name: fecap-clipping-portable
          path: dist/fecap-clipping-portable.zip
          if-no-files-found: error
      - name: Validar contrato da API Knewin
        run: python tests/test_knewin_api.py
      - name: Validar sonda de autenticação sem segredos
        run: python tests/test_session_auth_probe.py
      - name: Executar E2E público determinístico
        run: python tests/e2e_public_news.py
      - name: Confirmar evidência gerada
        run: test -s evidence/e2e-public-real-news.json
