name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar ambiente portátil
        run: python scripts/local_doctor.py
      - name: Validar plano do setup local
        run: python tests/test_setup_local.py
      - name: Validar contrato do bootstrap Windows Knewin
        run: python tests/test_knewin_windows_bootstrap_contract.py
      - name: Validar bootstrap Knewin nativo do Gateway
        run: python tests/test_knewin_gateway_bootstrap.py
      - name: Validar entrada do bootstrap Knewin nativo do Gateway
        run: python scripts/knewin_session_bootstrap.py --check
      - name: Validar sintaxe do bootstrap PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/knewin-session-capture.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Validar construção do pacote portátil
        run: python tests/test_build_portable.py
      - name: Validar Excel de homologação determinístico
        run: python tests/test_excel_homologation.py
      - name: Validar entrada do gerador Excel
        run: python scripts/build_homologation_excel.py --check
      - name: Validar contrato OneDrive one-shot
        run: python tests/test_onedrive_homologation.py
      - name: Validar entrada do publicador OneDrive
        run: python scripts/publish_onedrive_homologation.py --check
      - name: Validar pipeline Pareto one-shot
        run: python tests/test_homologation_pipeline.py
      - name: Validar entrada do pipeline Pareto
        run: python scripts/run_homologation_pipeline.py --check
      - name: Validar contrato SharePoint one-shot
        run: python tests/test_sharepoint_homologation.py
      - name: Validar entrada do publicador SharePoint
        run: python scripts/publish_sharepoint_homologation.py --check
      - name: Validar esquema JSON sem valores
        run: python tests/test_json_schema_probe.py
      - name: Validar descoberta de endpoints Knewin
        run: python tests/test_knewin_discovery.py
      - name: Validar plano evidenciado do coletor Knewin
        run: python tests/test_knewin_collector_plan.py
      - name: Validar contrato runtime sanitizado do Knewin
        run: python tests/test_knewin_runtime_validation.py
      - name: Validar coletor autenticado one-shot
        run: python tests/test_knewin_session_collector.py
      - name: Validar seleção fail-closed da sonda automática
        run: python tests/test_knewin_auto_probe.py
      - name: Validar portal Knewin News e rota SPA de login
        run: python tests/test_knewin_news_probe.py
      - name: Validar gatilho da sonda guiada
        run: python tests/test_knewin_guided_probe.py
      - name: Validar execução direta da sonda Knewin News
        run: python scripts/probe_knewin_news.py --check
      - name: Validar entrada da validação runtime
        run: python scripts/validate_knewin_publications_runtime.py --check
      - name: Validar entrada do coletor autenticado
        run: python scripts/collect_knewin_publications.py --check
      - name: Validar sintaxe dos scripts interativos
        run: python -m py_compile scripts/knewin_session_bootstrap.py scripts/probe_knewin_session.py scripts/probe_knewin_session_auto.py scripts/probe_knewin_news.py scripts/probe_knewin_news_guided.py scripts/analyze_knewin_inventory.py scripts/prepare_knewin_collector.py scripts/validate_knewin_publications_runtime.py scripts/collect_knewin_publications.py scripts/build_homologation_excel.py scripts/publish_onedrive_homologation.py scripts/publish_sharepoint_homologation.py scripts/run_homologation_pipeline.py
      - name: Gerar pacote portátil
        run: python scripts/build_portable.py
      - name: Publicar pacote portátil
        uses: actions/upload-artifact@v4
        with:
          name: fecap-clipping-portable
          path: dist/fecap-clipping-portable.zip
          if-no-files-found: error
      - name: Validar contrato da API Knewin
        run: python tests/test_knewin_api.py
      - name: Validar sonda de autenticação sem segredos
        run: python tests/test_session_auth_probe.py
      - name: Executar E2E público determinístico
        run: python tests/e2e_public_news.py
      - name: Confirmar evidência gerada
        run: test -s evidence/e2e-public-real-news.json
