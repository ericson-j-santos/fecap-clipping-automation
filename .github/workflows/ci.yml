name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e-public-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar E2E determinístico
        run: python tests/e2e_public_news.py
      - name: Confirmar evidência gerada
        run: test -s evidence/e2e-public-real-news.json
